spring.application.name=seat-reservation

spring.datasource.url=jdbc:mysql://localhost:3307/seat_reservation
spring.datasource.username=seat_user
spring.datasource.password=seat_pass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
# Flyway migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# Show Flyway logs
logging.level.org.flywaydb=DEBUG

app.jwt.secret = this_is_secret_key_12345678901234567890;
app.jwt.expiration = 3600000

# Actuator Endpoints
management.endpoints.web.exposure.include=health,info,metrics,prometheus

# Health Details
management.endpoint.health.show-details=always

# Application Metrics Tag
management.metrics.tags.application=seat-reservation


# Disable unnecessary open session
spring.jpa.open-in-view=false
server.port=8080
<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Admin | Seatly</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="data:,">
</head>

<body>
    <div id="nav"></div>
    <main class="wrap">
        <p class="tag">MANAGEMENT</p>
        <h1>Admin dashboard</h1>
        <div class="admin">
            <form id="showForm" class="panel">
                <h2>Create show</h2><label>Show name<input name="name" required></label><label>Price in paise<input
                        name="pricePaise" type="number" min="1" required></label><label>Per-user limit<input
                        name="perUserLimit" type="number" min="1" max="20" value="4" required></label><button
                    class="btn">Create show</button>
            </form>
            <form id="seatForm" class="panel">
                <h2>Add seats</h2><label>Show ID<input name="showId" type="number" min="1" required></label><label>Seat
                    numbers, comma separated<input name="seatNumbers" placeholder="A1,A2,A3" required></label><button
                    class="btn">Create seats</button>
            </form>
        </div>
        <div id="message"></div>
    </main>
    <script src="js/api.js"></script>
    <script src="js/common.js"></script>
    <script src="js/admin.js"></script>
</body>

</html>

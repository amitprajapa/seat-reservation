server:
  port: ${PORT:8080}

spring:
  application:
    name: seat-reservation

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/seat_reservation}
    username: ${DB_USERNAME:seat_user}
    password: ${DB_PASSWORD:seat_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:this_is_secret_key_12345678901234567890}
    expiration: 86400000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

  metrics:
    tags:
      application: seat-reservation